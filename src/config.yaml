site:
  name: efka
  site: 'https://efkaconsulting.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: 'efka'
    template: '%s — efka'
  description: 'Filipinler’den uygun çalışanların bulunması, değerlendirilmesi ve Türkiye’de yasal olarak istihdam edilmesine yönelik süreci aileler ve işletmeler için tek merkezden yöneten iş gücü danışmanlığı.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: efka consulting
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@efkaconsulting'
    site: '@efkaconsulting'
    cardType: summary_large_image

i18n:
  language: tr
  textDirection: ltr

apps:
  # The blog is off: the launch content supplies no posts and no blog appears in
  # the footer menu. The block stays so `astrowind:config` still exports
  # APP_BLOG, which src/utils/permalinks.ts reads.
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
